<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Gym Log</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f6f4;--card:#fff;--tx:#1a1a1c;--mut:#8a8a90;--line:#ececea;--acc:#1a1a1c;--acct:#fff;--g:#16a34a;--gb:#e6f5ea;--r:#dc2626;--chip:#f1f1ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f11;--card:#18181b;--tx:#f4f4f5;--mut:#8f8f98;--line:#26262b;--acc:#f4f4f5;--acct:#111;--g:#4ade80;--gb:#14281b;--r:#f87171;--chip:#232327}}
:root[data-theme="dark"]{--bg:#0f0f11;--card:#18181b;--tx:#f4f4f5;--mut:#8f8f98;--line:#26262b;--acc:#f4f4f5;--acct:#111;--g:#4ade80;--gb:#14281b;--r:#f87171;--chip:#232327}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);display:flex;gap:4px;padding:10px 12px;background:var(--bg);z-index:5}
.tabs button{flex:1;padding:10px;border:0;border-radius:10px;background:none;color:var(--mut);font-weight:700;font-size:15px}
.tabs button.on{background:var(--card);color:var(--tx);box-shadow:0 0 0 1px var(--line)}
main{padding:0 12px 40px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:6px;overflow:hidden}
.card.o{margin:12px 0;padding-bottom:12px}
.hd{display:flex;align-items:center;padding:8px 12px 8px 2px;cursor:pointer;min-height:42px}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.o .nm{font-size:18px}
.sum{margin-left:auto;padding-left:8px;font-size:13px;color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.tag{font-size:10px;color:var(--mut);margin-left:6px;font-weight:600;border:1px solid var(--line);border-radius:6px;padding:0 5px}
.in{padding:0 14px}
.grip{touch-action:none;cursor:grab;color:var(--mut);font-size:18px;padding:4px 8px;user-select:none;-webkit-user-select:none;opacity:.6}
.drag{position:relative;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.x{margin-left:auto;background:none;border:0;color:var(--mut);font-size:18px;padding:4px 6px}
.row{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.d{width:64px;font-size:12px;color:var(--mut);flex:none}
.s{flex:1;display:flex;flex-wrap:wrap;gap:4px}
.chip{background:var(--chip);border-radius:8px;padding:3px 8px;font-size:13px;font-variant-numeric:tabular-nums}
.chip b{color:var(--mut);margin-right:4px;font-size:11px}
.chip.pr{background:var(--gb);color:var(--g);font-weight:700}.chip.pr b{color:var(--g)}
.chip i{font-style:normal;color:var(--mut);margin-left:6px;cursor:pointer}
.ind{width:20px;text-align:center;font-weight:800;flex:none}.up{color:var(--g)}.dn{color:var(--r)}.eq{color:var(--mut)}
.empty{color:var(--mut);font-size:13px;padding:6px 0}
.log{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.tw{display:flex;gap:6px;align-items:flex-end;margin-bottom:10px}
.tw button{flex:1;height:36px;border:0;border-radius:10px;background:var(--chip);color:var(--mut);font-size:13px;font-weight:600}
.tw button.on{flex:2;height:50px;background:var(--acc);color:var(--acct);font-size:16px;font-weight:800}
.lr{display:flex;gap:8px;align-items:flex-end}.lr.u{flex-wrap:wrap}
.f{flex:1;min-width:0}.f label{display:block;font-size:11px;color:var(--mut);margin-bottom:2px;font-weight:600}
.lr.u .f{flex:1 1 28%}.lr.u .st input{font-size:15px}.lr.u .st button{width:24px}.lr.u .add{flex:1 1 60%}
.st{display:flex;align-items:center;background:var(--chip);border-radius:10px;overflow:hidden}
.st button{border:0;background:none;color:var(--tx);width:30px;height:42px;font-size:20px;flex:none}
.st input{width:100%;min-width:0;border:0;background:none;color:var(--tx);text-align:center;font-size:17px;font-weight:700;height:42px;padding:0}
.add{border:0;background:var(--acc);color:var(--acct);border-radius:10px;height:42px;padding:0 16px;font-weight:800;font-size:15px;flex:none}
.addset{width:100%;margin-top:10px;padding:11px;border:0;background:var(--chip);color:var(--tx);border-radius:12px;font-weight:800;font-size:15px}
.new{width:100%;padding:13px;border:1px dashed var(--line);background:none;color:var(--mut);border-radius:14px;font-size:14px;font-weight:600}
.div{display:flex;align-items:center;gap:8px;margin:18px 2px 8px}
.div .l{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}.div .ln{flex:1;height:1px;background:var(--line)}
.menu{display:flex;gap:8px;margin-bottom:8px}.menu button{flex:1;height:38px;border:0;border-radius:10px;background:var(--chip);color:var(--tx);font-weight:600}.menu button.dng{color:var(--r)}
.menu input[type=text]{flex:1;min-width:0;padding:0 10px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--tx);font-size:16px}
.opts{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px;font-size:13px;color:var(--mut)}.opts label{display:flex;gap:6px;align-items:center}
.chip.wu{opacity:.6}.note{width:100%;margin:8px 0 2px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:none;color:var(--tx);font-size:14px}.spark{margin:6px 0 2px}.spark small{display:block;font-size:11px;color:var(--mut)}.wub{border:1px solid var(--line);background:none;color:var(--mut);border-radius:10px;padding:0 12px;font-weight:700;font-size:13px}.wub.on{background:var(--chip);color:var(--tx)}#rest{display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;background:var(--acc);color:var(--acct);border-radius:14px;padding:10px 14px;align-items:center;gap:8px;z-index:30;font-weight:700}#rest.go{background:var(--g);color:#fff}#rest b{font-size:20px;font-variant-numeric:tabular-nums;margin-right:auto}#rest button{border:0;background:rgba(127,127,127,.3);color:inherit;border-radius:8px;height:32px;padding:0 10px;font-weight:700}.bk{position:fixed;inset:0;background:var(--bg);z-index:40;padding:calc(16px + env(safe-area-inset-top,0px)) 14px 14px;display:flex;flex-direction:column;gap:10px}.bk textarea{flex:1;width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--tx);font:12px/1.3 monospace;padding:10px}.bk .b{display:flex;gap:8px}.bk .b button{flex:1;height:44px;border:0;border-radius:10px;font-weight:700;background:var(--chip);color:var(--tx)}.bk .b button.p{background:var(--acc);color:var(--acct)}.bk p{margin:0;font-size:13px;color:var(--mut)}.link{background:none;border:0;color:var(--mut);font-size:13px;margin:16px auto 0;display:block;text-decoration:underline}
.form{display:flex;flex-direction:column;gap:10px;padding:14px}
.form input[type=text]{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--tx);font-size:16px}
.form label.c{display:flex;gap:8px;align-items:center;font-size:14px}
.form .b{display:flex;gap:8px}.form .b button{flex:1;height:44px;border-radius:10px;border:0;font-weight:700;background:var(--chip);color:var(--tx)}.form .b button.p{background:var(--acc);color:var(--acct)}
</style><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#1a1a1c"></head><body>
<div class="tabs" id="tabs"></div><main id="app"></main><div id="rest"></div><div id="bk"></div>
<script>
const SPLITS=['Push','Pull','Legs'],TABS=[...SPLITS,'Locker'],KEY='gymlog_v1';
let S={ex:[],logs:{},tab:'Push'},draft={},adding=false,menuId=null,openId=null,cur=null,renId=null,delArm=null,restEnd=0,restLen=90,bkOpen=false,bkDel=false;
try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x)S=Object.assign(S,x)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const today=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmt=d=>d==(()=>{const y=new Date();y.setDate(y.getDate()-1);return today(y)})()?'Yesterday':new Date(d+'T12:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rp=(s,u)=>u?(s.l+s.rr)/2:s.r,ty=s=>s.t||'s',best=(ss,u)=>Math.max(0,...ss.filter(s=>!s.wu).map(s=>s.w*rp(s,u)));
const txt=(s,u,b)=>(b?'':s.w+'kg × ')+(u?s.l+'|'+s.rr:s.r)+(b?' reps':'');
function sessions(id){const m={};(S.logs[id]||[]).forEach((s,i)=>{(m[s.d]=m[s.d]||[]).push({...s,i})});return Object.keys(m).sort().reverse().map(d=>({d,sets:m[d]}))}
function prs(e){const L=S.logs[e.id]||[],o={};L.forEach((s,i)=>{if(s.wu)return;const p=L.slice(0,i).filter(q=>!q.wu&&(!e.cable||ty(q)==ty(s)));if(!p.length)return;const h=p.filter(q=>q.w>=s.w);o[i]=s.w>Math.max(...p.map(q=>q.w))||(h.length>0&&rp(s,e.uni)>Math.max(...h.map(q=>rp(q,e.uni))))});return o}
function getDraft(e){const L=S.logs[e.id]||[],l=L[L.length-1],d=draft[e.id]||(draft[e.id]=l?{w:l.w,r:l.r||8,l:l.l||8,rr:l.rr||8,t:ty(l)}:{w:20,r:8,l:8,rr:8,t:'s'});if(!d.t)d.t='s';return d}
const menuHtml=e=>renId==e.id?`<div class="menu"><input type="text" id="rn" value="${esc(e.name)}"><button data-a="rensave" data-id="${e.id}">Save</button></div>`:`<div class="menu"><button data-a="ren" data-id="${e.id}">Rename</button><button class="dng" data-a="rm" data-id="${e.id}">${delArm==e.id?'Tap to confirm':'Delete'}</button></div><div class="menu">${SPLITS.filter(s=>s!=e.split).map(s=>`<button data-a="mv" data-id="${e.id}" data-v="${s}">Move to ${s}</button>`).join('')}</div>`+(e.type=='div'?'':`<div class="opts"><label><input type="checkbox" data-opt="uni" data-id="${e.id}" ${e.uni?'checked':''}> Left / right reps</label><label><input type="checkbox" data-opt="cable" data-id="${e.id}" ${e.cable?'checked':''}> Cable tower</label><label><input type="checkbox" data-opt="bw" data-id="${e.id}" ${e.bw?'checked':''}> Bodyweight</label></div>`);
function spark(e,ss){const k=e.cable&&ss[0]?ty(ss[0].sets[ss[0].sets.length-1]):0,v=ss.slice(0,12).reverse().map(x=>best(e.cable?x.sets.filter(s=>ty(s)==k):x.sets,e.uni)).filter(n=>n>0);if(v.length<2)return '';const mx=Math.max(...v),mn=Math.min(...v),r=mx-mn||1,P=v.map((n,i)=>[4+i*(292/(v.length-1)),38-(n-mn)/r*32]);return `<div class="spark"><svg viewBox="0 0 300 44" width="100%"><polyline fill="none" stroke="var(--mut)" stroke-width="1.5" points="${P.map(p=>p.join(',')).join(' ')}"/>${P.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i==P.length-1?3.5:2}" fill="${i==P.length-1?'var(--g)':'var(--mut)'}"/>`).join('')}</svg><small>Best set (kg × reps), last ${v.length} sessions: ${Math.round(v[0])} → ${Math.round(v[v.length-1])}</small></div>`}
function card(e){
const ss=sessions(e.id),t=ss.find(x=>x.d==today()),hist=(t?[t]:[]).concat(ss.filter(x=>x.d!=today()).slice(0,3)),pr=prs(e),open=cur==e.id;
const ind=k=>{const x=ss[k],tt=e.cable?ty(x.sets[x.sets.length-1]):0,f=y=>e.cable?y.sets.filter(s=>ty(s)==tt):y.sets,o=ss.slice(k+1).find(y=>f(y).length);if(!o)return '<span class="eq">–</span>';const a=best(f(x),e.uni),b=best(f(o),e.uni);return a>b?'<span class="up">▲</span>':a<b?'<span class="dn">▼</span>':'<span class="eq">=</span>'};
const tags=(e.uni?'<span class="tag">L/R</span>':'')+(e.cable?'<span class="tag">Cable</span>':'')+(e.bw?'<span class="tag">BW</span>':'');
let sum='';if(!open){const l0=ss[0];if(l0){const bw=l0.sets.filter(s=>!s.wu),bs=(bw.length?bw:l0.sets).reduce((a,s)=>s.w*rp(s,e.uni)>=a.w*rp(a,e.uni)?s:a);sum=(l0.sets.some(s=>pr[s.i])?'<span class="up">★</span> ':'')+(l0.d==today()?'Today':fmt(l0.d))+' · '+(e.bw?'':bs.w+'×')+(e.uni?bs.l+'|'+bs.rr:bs.r)+' '+ind(0)}}
let h=`<div class="card${open?' o':''}" data-item="${e.id}"><div class="hd" data-a="tog" data-id="${e.id}"><span class="grip" data-drag>⠿</span><span class="nm">${esc(e.name)}</span>${tags}${open?`<button class="x" data-a="menu" data-id="${e.id}">⋯</button>`:`<span class="sum">${sum}</span>`}</div>`;
if(open){h+='<div class="in">'+(menuId==e.id?menuHtml(e):'');h+=spark(e,ss)+`<input class="note" type="text" placeholder="Notes (seat, grip…)" value="${esc(e.note||'')}" data-a="note" data-id="${e.id}">`;
h+=hist.map(x=>{const isT=x.d==today();return `<div class="row"><div class="d">${isT?'<b>Today</b>':fmt(x.d)}</div><div class="s">${x.sets.map(s=>`<span class="chip${pr[s.i]?' pr':''}${s.wu?' wu':''}">${s.wu?'<b>W</b>':''}${e.cable?`<b>${ty(s)=='s'?'S':'D'}</b>`:''}${txt(s,e.uni,e.bw)}${pr[s.i]?' ★':''}${isT?`<i data-a="del" data-v="${s.i}" data-id="${e.id}">✕</i>`:''}</span>`).join('')}</div><div class="ind">${ind(ss.indexOf(x))}</div></div>`}).join('')||'<div class="empty">No sessions yet — log your first set below.</div>';
if(openId==e.id){const d=getDraft(e),st=(f,l,step)=>`<div class="f"><label>${l}</label><div class="st"><button data-a="step" data-id="${e.id}" data-f="${f}" data-v="${-step}">−</button><input type="number" inputmode="decimal" step="any" value="${d[f]}" data-a="in" data-id="${e.id}" data-f="${f}"><button data-a="step" data-id="${e.id}" data-f="${f}" data-v="${step}">+</button></div></div>`;
h+=`<div class="log">${e.cable?`<div class="tw"><button class="${d.t=='s'?'on':''}" data-a="tw" data-id="${e.id}" data-v="s">Single</button><button class="${d.t=='d'?'on':''}" data-a="tw" data-id="${e.id}" data-v="d">Double</button></div>`:''}<div style="margin-bottom:8px"><button class="wub${d.wu?' on':''}" data-a="wu" data-id="${e.id}" style="height:30px">Warm-up set</button></div><div class="lr${e.uni?' u':''}">${e.bw?'':st('w','kg',2.5)}${e.uni?st('l','Left',1)+st('rr','Right',1):st('r','Reps',1)}<button class="add" data-a="add" data-id="${e.id}">Add</button><button class="x" data-a="close" style="margin:0">✕</button></div></div>`}
else h+=`<button class="addset" data-a="open" data-id="${e.id}">+ Set</button>`;
h+='</div>'}
return h+'</div>'}
function render(){
document.getElementById('tabs').innerHTML=TABS.map(s=>`<button class="${s==S.tab?'on':''}" data-a="tab" data-v="${s}">${s}</button>`).join('');
if(S.tab=='Locker'){document.getElementById('app').innerHTML=`<div class="card" style="padding:28px 16px;text-align:center"><div style="font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:10px">Locker number</div><input type="text" inputmode="numeric" data-a="lk" value="${esc(S.locker||'')}" placeholder="—" style="width:100%;border:0;background:none;color:var(--tx);text-align:center;font-size:72px;font-weight:800;outline:none"></div>`;return}
let h=S.ex.filter(e=>e.split==S.tab).map(e=>e.type=='div'?`<div data-item="${e.id}"><div class="div"><span class="grip" data-drag>⠿</span><span class="l">${esc(e.name)}</span><div class="ln"></div><button class="x" style="margin:0" data-a="menu" data-id="${e.id}">⋯</button></div>${menuId==e.id?`<div class="in">${menuHtml(e)}</div>`:''}</div>`:card(e)).join('');
h+=adding=='div'?`<div class="card form"><input type="text" id="nm" placeholder="Section name, e.g. Chest"><div class="b"><button data-a="cancel">Cancel</button><button class="p" data-a="creatediv">Add divider</button></div></div>`:adding?`<div class="card form"><input type="text" id="nm" placeholder="Exercise name"><label class="c"><input type="checkbox" id="un"> Left &amp; right reps</label><label class="c"><input type="checkbox" id="cb"> Cable tower (single / double)</label><label class="c"><input type="checkbox" id="bw"> Bodyweight (no weight)</label><div class="b"><button data-a="cancel">Cancel</button><button class="p" data-a="create">Add to ${S.tab}</button></div></div>`:`<div style="display:flex;gap:8px"><button class="new" data-a="new">+ Exercise</button><button class="new" data-a="newdiv" style="width:auto;flex:none;padding:13px 16px">+ Divider</button></div>`;
h+=`<button class="link" data-a="bk">Backup &amp; restore</button>`;document.getElementById('app').innerHTML=h;const n=document.getElementById('nm')||document.getElementById('rn');if(n)n.focus()}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.a=='in'){const v=parseFloat(t.value);draft[t.dataset.id][t.dataset.f]=isNaN(v)?0:v}else if(t.dataset.a=='note'){S.ex.find(x=>x.id==t.dataset.id).note=t.value;save()}else if(t.dataset.a=='lk'){S.locker=t.value;save()}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.opt){S.ex.find(x=>x.id==t.dataset.id)[t.dataset.opt]=t.checked;save();render()}});
document.addEventListener('click',e=>{if(e.target.closest('[data-drag]'))return;const t=e.target.closest('[data-a]');if(!t||t.tagName=='INPUT')return;const a=t.dataset.a,id=t.dataset.id;
if(a=='tab'){S.tab=t.dataset.v;adding=false;cur=openId=menuId=null}
else if(a=='tog'){cur=cur==id?null:id;openId=menuId=renId=delArm=null}
else if(a=='step'){const d=draft[id],f=t.dataset.f;d[f]=Math.max(0,Math.round((d[f]+parseFloat(t.dataset.v))*100)/100)}
else if(a=='tw'){const d=draft[id],l=[...(S.logs[id]||[])].reverse().find(q=>ty(q)==t.dataset.v);d.t=t.dataset.v;if(l){d.w=l.w;d.r=l.r||d.r;d.l=l.l||d.l;d.rr=l.rr||d.rr}}
else if(a=='add'){const ex=S.ex.find(x=>x.id==id),d=draft[id];if(!d.w&&!d.r&&!d.l&&!d.rr)return;const s={d:today(),w:ex.bw?1:d.w};if(ex.uni){s.l=d.l;s.rr=d.rr}else s.r=d.r;if(ex.cable)s.t=d.t;if(d.wu){s.wu=1;d.wu=false}(S.logs[id]=S.logs[id]||[]).push(s);startRest()}
else if(a=='del'){S.logs[id].splice(+t.dataset.v,1)}
else if(a=='open'){openId=id}else if(a=='close'){openId=null}
else if(a=='wu'){draft[id].wu=!draft[id].wu}
else if(a=='mv'){const ex=S.ex.find(x=>x.id==id);ex.split=t.dataset.v;cur=null;menuId=null}
else if(a=='rest'){restAdj(+t.dataset.v);return}
else if(a=='restx'){restEnd=0;paintRest();return}
else if(a=='bk'){bkOpen=true;bkDel=false;paintBk(JSON.stringify({ex:S.ex,logs:S.logs,rest:S.rest,locker:S.locker}));return}
else if(a=='bkclose'){bkOpen=false;paintBk();return}
else if(a=='bkcopy'){const ta=document.getElementById('bkt');ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(x){}if(!ok&&navigator.clipboard)navigator.clipboard.writeText(ta.value).catch(()=>{});setBk(ok?'Copied.':'Selected — press and hold to copy.');return}
else if(a=='bkrestore'){if(!bkDel){bkDel=true;t.textContent='Tap to confirm';return}try{const x=JSON.parse(document.getElementById('bkt').value);if(!Array.isArray(x.ex)||typeof x.logs!='object')throw 0;S.ex=x.ex;S.logs=x.logs;S.rest=x.rest;S.locker=x.locker;restLen=S.rest||90;bkOpen=false;paintBk();cur=openId=menuId=null;draft={}}catch(err){bkDel=false;t.textContent='Restore';setBk('That doesn’t look like a valid backup.');return}}
else if(a=='menu'){menuId=menuId==id?null:id;renId=null;delArm=null}
else if(a=='ren'){renId=id}
else if(a=='rensave'){const ex=S.ex.find(x=>x.id==id),n=document.getElementById('rn').value.trim();if(n)ex.name=n;renId=null;menuId=null}
else if(a=='rm'){if(delArm!=id){delArm=id}else{S.ex=S.ex.filter(x=>x.id!=id);delete S.logs[id];menuId=null;delArm=null;if(cur==id)cur=null}}
else if(a=='new')adding=true;else if(a=='newdiv')adding='div';else if(a=='cancel')adding=false;
else if(a=='creatediv'){const n=document.getElementById('nm').value.trim();if(!n)return;S.ex.push({id:'d'+Date.now(),type:'div',name:n,split:S.tab});adding=false}
else if(a=='create'){const n=document.getElementById('nm').value.trim();if(!n)return;S.ex.push({id:'e'+Date.now(),name:n,split:S.tab,uni:document.getElementById('un').checked,cable:document.getElementById('cb').checked,bw:document.getElementById('bw').checked});adding=false}
save();render()});
restLen=S.rest||90;let restDone=0,AC=null;
const fmtT=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function paintRest(){const r=document.getElementById('rest');if(!restEnd){r.style.display='none';return}const l=Math.ceil((restEnd-Date.now())/1000);r.style.display='flex';r.className=l<=0?'go':'';r.innerHTML=l<=0?'<b>Go!</b><button data-a="restx">Done</button>':`<span>Rest</span><b>${fmtT(l)}</b><button data-a="rest" data-v="-15">−15</button><button data-a="rest" data-v="15">+15</button><button data-a="restx">✕</button>`}
function beep(){try{[0,.25].forEach(t=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;g.gain.value=.2;o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+.15)})}catch(x){}}
function startRest(){try{if(window.Notification&&Notification.permission=='default')Notification.requestPermission();if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(x){}restEnd=Date.now()+restLen*1000;restDone=0;paintRest()}
function restAdj(d){restLen=Math.max(15,restLen+d);S.rest=restLen;save();restEnd=Math.max(Date.now()+1000,restEnd+d*1000);restDone=0;paintRest()}
setInterval(()=>{if(!restEnd)return;const l=Math.ceil((restEnd-Date.now())/1000);if(l<=0&&!restDone){restDone=1;try{navigator.vibrate&&navigator.vibrate([300,100,300])}catch(x){}beep();try{if(window.Notification&&Notification.permission=='granted')new Notification('Rest over',{body:'Time for your next set'})}catch(x){}paintRest();setTimeout(()=>{if(restDone&&restEnd&&Date.now()>=restEnd){restEnd=0;paintRest()}},8000)}else if(l>0){const b=document.querySelector('#rest b');if(b)b.textContent=fmtT(l)}},500);
function paintBk(v){const b=document.getElementById('bk');if(!bkOpen){b.className='';b.innerHTML='';return}b.className='bk';b.innerHTML='<p>Copy this text and keep it somewhere safe (Notes, or email it to yourself). To restore, paste a backup over it and tap Restore.</p><textarea id="bkt" spellcheck="false"></textarea><div class="b"><button data-a="bkcopy">Copy</button><button data-a="bkrestore">Restore</button><button class="p" data-a="bkclose">Close</button></div>';document.getElementById('bkt').value=v}
const setBk=m=>{document.querySelector('#bk p').textContent=m};
let dg=null;
document.addEventListener('pointerdown',e=>{const g=e.target.closest('[data-drag]');if(!g)return;e.preventDefault();const el=g.closest('[data-item]');dg={el};el.classList.add('drag');try{g.setPointerCapture(e.pointerId)}catch(x){}});
document.addEventListener('pointermove',e=>{if(!dg)return;const el=dg.el,y=e.clientY;if(y<90)scrollBy(0,-10);else if(y>innerHeight-90)scrollBy(0,10);
const p=el.previousElementSibling,n=el.nextElementSibling;
if(p&&p.dataset.item){const r=p.getBoundingClientRect();if(y<r.top+r.height/2)p.before(el)}
if(n&&n.dataset.item){const r=n.getBoundingClientRect();if(y>r.top+r.height/2)n.after(el)}});
const endDrag=()=>{if(!dg)return;dg.el.classList.remove('drag');const ids=[...document.querySelectorAll('#app [data-item]')].map(x=>x.dataset.item),cu=S.ex.filter(x=>x.split==S.tab),ot=S.ex.filter(x=>x.split!=S.tab),m=Object.fromEntries(cu.map(x=>[x.id,x]));S.ex=ot.concat(ids.map(i=>m[i]).filter(Boolean));dg=null;save();render()};
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
